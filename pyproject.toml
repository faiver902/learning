[tool.poetry]
name = "trigger-flow"
version = "0.0.1"
description = "Project with FastAPI and Celery"
authors = ["Vladimir faiver90@gmail.com"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
fastapi = "^0.116.1"
redis = "^6.3.0"
httpx = "0.28.1"
passlib = "^1.7.4"
celery = "^5.5.3"
dotenv = "0.9.9"
requests = "2.32.4"
aiosmtplib = "^4.0.1"
pytz = "^2025.2"
ruff = "^0.12.7"
uvicorn = "^0.35.0"
gunicorn = "^23.0.0"
asyncpg = "^0.30.0"
psycopg2-binary = "^2.9.9"
python-jose = { extras = ["pycryptodome"], version = "^3.5.0" }
cryptography = "^45.0.5"
pydantic = { extras = ["email"], version = "^2.11.7" }
python-json-logger = "^3.3.0"
anyio = "4.10.0"
argcomplete = "3.6.2"
beautifulsoup4 = "4.13.4"
build = "1.3.0"
cachecontrol = "0.14.3"
certifi = "2025.7.14"
charset-normalizer = "3.4.2"
cleo = "2.1.0"
click = "8.2.1"
colorama = "0.4.6"
crashtest = "0.4.1"
distlib = "0.4.0"
dulwich = "0.22.8"
et-xmlfile = "2.0.0"
fastjsonschema = "2.21.1"
filelock = "3.18.0"
findpython = "0.6.3"
greenlet = "3.2.3"
h11 = "0.16.0"
httpcore = "1.0.9"
idna = "3.10"
installer = "0.7.0"
jaraco-classes = "3.4.0"
jaraco-context = "6.0.1"
jaraco-functools = "4.2.1"
keyring = "25.6.0"
lxml = "6.0.0"
more-itertools = "10.7.0"
msgpack = "1.1.1"
openpyxl = "3.1.5"
packaging = "25.0"
pbs-installer = "2025.7.23"
pipx = "1.7.1"
pkginfo = "1.12.1.2"
platformdirs = "4.3.8"
playwright = "1.53.0"
poetry = "2.1.4"
poetry-core = "2.1.3"
pyee = "13.0.0"
pyproject-hooks = "1.2.0"
python-docx = "1.2.0"
python-dotenv = "1.1.1"
pywin32-ctypes = "0.2.3"
rapidfuzz = "3.13.0"
requests-toolbelt = "1.0.0"
shellingham = "1.5.4"
sniffio = "1.3.1"
soupsieve = "2.7"
tenacity = "9.1.2"
tomlkit = "0.13.3"
tqdm = "4.67.1"
trove-classifiers = "2025.5.9.12"
typing-extensions = "4.14.1"
urllib3 = "2.5.0"
userpath = "1.9.2"
virtualenv = "20.32.0"
zstandard = "0.23.0"

[tool.poetry.group.dev.dependencies]
alembic = "^1.16.4"
pytest = "^8.4.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501",
    "B008",
    "B904",
    "E402",
    "B018",
    "E741",
    "UP035",
    "F841",
    "B026",
    "B024",
    "UP006",
    "UP008"]
fixable = ["ALL"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.black]
line-length = 88
target-version = ["py311"]